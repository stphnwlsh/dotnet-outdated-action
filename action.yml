name: 'Dotnet Outdated - Install and Update'
description: 'Installs the dotnet outdated tool and upgrades every outdated NuGet package in your solution, project or folder.'
author: 'Stephen Walsh'
branding:
  icon: 'arrow-down-circle'
  color: 'green'

inputs:
  location:
    description: 'The solution, project or folder to check. Defaults to the working directory.'
    required: false
    default: '.'
  includes:
    description: 'Comma separated list. Only packages whose names contain one of these values are upgraded.'
    required: false
    default: ''
  excludes:
    description: 'Comma separated list. Packages whose names contain one of these values are left alone.'
    required: false
    default: ''
  version-lock:
    description: 'Stops upgrades crossing a version boundary: None, Major or Minor.'
    required: false
    default: 'None'
  pre-release:
    description: 'When to consider pre-release versions: Auto, Always or Never.'
    required: false
    default: 'Auto'
  tool-version:
    description: 'The version of dotnet-outdated-tool to install. Empty means the latest.'
    required: false
    default: ''

outputs:
  updated:
    description: 'true when at least one package was upgraded, false when everything was already current.'
    value: ${{ steps.update.outputs.updated }}

runs:
  using: 'composite'
  steps:
    - name: Install dotnet outdated
      shell: bash
      env:
        TOOL_VERSION: ${{ inputs.tool-version }}
      run: |
        set -euo pipefail

        version_args=()
        if [[ -n "$TOOL_VERSION" ]]; then
          version_args=(--version "$TOOL_VERSION")
        fi

        if dotnet tool list --global | grep -qi '^dotnet-outdated-tool '; then
          dotnet tool update --global dotnet-outdated-tool ${version_args[@]+"${version_args[@]}"}
        else
          dotnet tool install --global dotnet-outdated-tool ${version_args[@]+"${version_args[@]}"}
        fi

        tools_dir="$HOME/.dotnet/tools"
        if command -v cygpath > /dev/null; then
          tools_dir="$(cygpath -w "$tools_dir")"
        fi
        echo "$tools_dir" >> "$GITHUB_PATH"

    - name: Upgrade outdated packages
      id: update
      shell: bash
      env:
        LOCATION: ${{ inputs.location }}
        INCLUDES: ${{ inputs.includes }}
        EXCLUDES: ${{ inputs.excludes }}
        VERSION_LOCK: ${{ inputs.version-lock }}
        PRE_RELEASE: ${{ inputs.pre-release }}
      run: |
        set -uo pipefail

        args=("${LOCATION:-.}" --upgrade --version-lock "$VERSION_LOCK" --pre-release "$PRE_RELEASE")

        # Spaces around the commas are forgiven. Life is too short.
        IFS=',' read -ra include_list <<< "$INCLUDES"
        for value in ${include_list[@]+"${include_list[@]}"}; do
          value="${value// /}"
          if [[ -n "$value" ]]; then args+=(--include "$value"); fi
        done

        IFS=',' read -ra exclude_list <<< "$EXCLUDES"
        for value in ${exclude_list[@]+"${exclude_list[@]}"}; do
          value="${value// /}"
          if [[ -n "$value" ]]; then args+=(--exclude "$value"); fi
        done

        echo "dotnet outdated ${args[*]}"

        log="$RUNNER_TEMP/dotnet-outdated.log"
        dotnet outdated "${args[@]}" 2>&1 | tee "$log"
        status=${PIPESTATUS[0]}

        if [[ $status -ne 0 ]] || grep -q "Errors occurred" "$log"; then
          echo "updated=false" >> "$GITHUB_OUTPUT"
          echo "::error title=dotnet outdated::dotnet outdated failed with exit code $status. The log above has the details."
          exit 1
        fi

        if grep -q "No outdated dependencies" "$log"; then
          echo "updated=false" >> "$GITHUB_OUTPUT"
          echo "### dotnet outdated: nothing to do" >> "$GITHUB_STEP_SUMMARY"
          echo "Every package is already current. Have a biscuit." >> "$GITHUB_STEP_SUMMARY"
        else
          echo "updated=true" >> "$GITHUB_OUTPUT"
          {
            echo "### dotnet outdated: packages upgraded"
            echo
            echo '```text'
            cat "$log"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
        fi
